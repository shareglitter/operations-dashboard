# Glitter Ops Dashboard — Automated Monthly Refresh
# Runs on the 2nd of each month at 6am ET (allow a day buffer for month-end cleans)
# Pulls fresh data from Airtable, updates data.js, and commits
# Netlify auto-deploys from the commit

name: Monthly Data Refresh

on:
  schedule:
    - cron: '0 10 2 * *'  # 2nd of each month, 10:00 UTC (6am ET)
  workflow_dispatch:  # Allow manual trigger from GitHub UI

jobs:
  refresh:
    runs-on: ubuntu-latest
    # The job pushes the regenerated data.js back to main. Without this the
    # default GITHUB_TOKEN is read-only and `git push` dies with exit 128.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Run refresh script
        env:
          AIRTABLE_TOKEN: ${{ secrets.AIRTABLE_TOKEN }}
          # Optional: Slack Incoming Webhook. If set, the president's KPIs are
          # posted to Slack for manual paste into OpsHub → Monthly Metrics.
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: node refresh.js

      - name: Commit and push updated data
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add data.js health_data.js

          # Only commit if the data actually changed
          if git diff --cached --quiet; then
            echo "No data changes — nothing to commit."
            exit 0
          fi
          git commit -m "Monthly data refresh $(date +%Y-%m)"

          # A bare push is a non-fast-forward if anything landed on main since
          # checkout, or if this is a re-run replaying an older commit SHA.
          # Rebase our data-only commit onto the current tip and retry.
          for attempt in 1 2 3; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              echo "Pushed data refresh."
              exit 0
            fi
            echo "Push attempt $attempt failed — retrying in 5s."
            sleep 5
          done
          echo "Could not push after 3 attempts."
          exit 1
